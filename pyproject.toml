[project]
name = "podintel"
version = "0.1.0"
description = "PodIntel — Podcast Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "aiokafka>=0.11",
    "qdrant-client>=1.12",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "feedparser>=6.0",
    "httpx>=0.27",
    "aioboto3>=13.2",
    "boto3>=1.35",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the required pattern

[tool.pytest.ini_options]
asyncio_mode = "auto"
