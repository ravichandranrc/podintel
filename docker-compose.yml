services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: podintel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/podintel-audio &&
      mc anonymous set download local/podintel-audio
      "

  migrate:
    build: .
    env_file: .env
    environment: &container-network-urls
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/podintel
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@postgres:5432/podintel
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      postgres: { condition: service_healthy }
    command: uv run alembic upgrade head

  app:
    build: .
    env_file: .env
    environment: *container-network-urls
    depends_on:
      migrate: { condition: service_completed_successfully }
      qdrant: { condition: service_started }
    ports: ["8000:8000"]
    command: uv run uvicorn web.main:app --host 0.0.0.0 --port 8000

  feed-poller:
    build: .
    env_file: .env
    environment: *container-network-urls
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: uv run python -m ingestion.feed_poller

  downloader:
    build: .
    env_file: .env
    environment: *container-network-urls
    depends_on:
      migrate: { condition: service_completed_successfully }
      create-bucket: { condition: service_completed_successfully }
    command: uv run python -m audio_storage.downloader

  transcriber:
    build: .
    env_file: .env
    environment: *container-network-urls
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: uv run python -m transcription.transcriber

  analyzer:
    build: .
    env_file: .env
    environment: *container-network-urls
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: uv run python -m intelligence.analyzer

  embedder:
    build: .
    env_file: .env
    environment: *container-network-urls
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: uv run python -m semantic_search.embedder

volumes:
  pgdata:
  qdrant_storage:
  minio_data:
