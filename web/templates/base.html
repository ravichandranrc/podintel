<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PodIntel{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="logo">PodIntel</a>
        <form action="/search" method="get" class="header-search">
            <input type="text" name="q" placeholder="Search podcasts by topic, person, technology..." value="{{ query|default('') }}">
            <button type="submit">Search</button>
        </form>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
